<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Website</title>
  <style>
    header {
      background-color: #4a90e2;
      color: white;
      text-align: center;
      padding: 20px 0;
    }

    nav {
      background-color: #f2f2f2;
      text-align: center;
      padding: 10px 0;
    }

    nav a {
      text-decoration: none;
      color: #333;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      color: #4a90e2;
    }

    main {
      max-width: 600px;
      margin: 30px auto;
      padding: 0 15px;
      text-align: center;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Website</h1>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <main>
    <p>
      Hi! I'm <strong>Krati</strong>, a passionate learner exploring the world of <em>web development</em>. 
      This page is a simple demonstration of how HTML elements come together to build a clean and structured webpage.
    </p>
  </main>

</body>
</html>
