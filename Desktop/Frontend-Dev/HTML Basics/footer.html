<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Website</title>
  <style>
    header {
      background-color: #4a90e2;
      color: white;
      text-align: center;
      padding: 20px 0;
    }

    nav {
      background-color: #f2f2f2;
      text-align: center;
      padding: 10px 0;
    }

    nav a {
      text-decoration: none;
      color: #333;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      color: #4a90e2;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 15px;
      font-family: Arial, sans-serif;
    }

    section, article, aside {
      margin-top: 30px;
      text-align: left;
    }

    section h2, article h2, aside h2 {
      color: #4a90e2;
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
    }

    aside ul {
      list-style-type: none;
      padding: 0;
    }

    aside li {
      margin-bottom: 8px;
    }

    aside a {
      text-decoration: none;
      color: #333;
    }

    aside a:hover {
      color: #4a90e2;
    }

    footer {
      background-color: #f2f2f2;
      text-align: center;
      padding: 15px 0;
      margin-top: 40px;
      font-size: 0.9em;
      color: #555;
    }
