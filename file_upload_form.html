<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
</head>
<body>
    <h1>Upload Your Image</h1>
    <form method="post" action="#" enctype="multipart/form-data">
        <label for="fileupload">Choose an image file:</label><br>
        <input type="file" if="fileupload" name="fileupload" accept=".jpg,.jpeg,.png" required><br><br>

        <p>only image files with <strong>.jpg</strong> or <strong>.png</strong> extensions are allowed.</p>

        <input type="submit" value="Upload">
    </form>
</body>
</html>
