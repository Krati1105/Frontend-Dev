<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>
    <h1>Login Form</h1>

    <form>
        <label for="name">Username:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>


         <!-- Hidden CSRF Token Field -->
        <!-- 
            CSRF (Cross-Site Request Forgery) tokens are used to prevent
            unauthorized commands being submitted from another site.
            The server verifies this token to ensure the request is legitimate.
        -->

        <input type="hidden" name="csrf_token" value="dummy_csrf_token_12345">
        <input type="submit" value="Login">
    </form>
</body>
</html>
