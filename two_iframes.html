<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two iframes example</title>
</head>
<body>
    <h1 align="center">My Introduction and Hobby Pages using iframes</h1>

    <div align="center">
        <iframe
           srcdoc="
           <h2>About Me</h2>
           <p>Hello! My name is Krati Agrawal. I am a web development enthusiast and love learning new technologies.</p>
           "
           width="80%"
           height="150"
           title="Introduction page"
           style="display:block;margin:auto;border:1px solid black;">
        </iframe>
    </div>

    <br>
    <div align="center">
        <iframe
            srcdoc="
        <h3>My Favorite Hobby</h3>
        <p>My favorite hobby is painting. I enjoy creating colorful artworks during my free time.</p>
        " 
           width="80%"
           height="150"
           title="Hobby page"
           style="display:block;margin:auto;border:1px solid black;">
        </iframe>
    </div>

</body>
</html>
