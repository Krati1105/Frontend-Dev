<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The <title> tag defines the title of the web page shown in the browser tab -->
    <title>Complete Head Elements Example</title>

    <!-- The <meta charset> tag specifies the character encoding for the document -->
    <meta charset="UTF-8">

    <!-- The <meta name="description"> tag gives a short summary of the page (used by search engines) -->
    <meta name="description" content="A sample webpage demonstrating all important head elements in HTML.">

    <!-- The <meta name="author"> tag defines the author of the webpage -->
    <meta name="author" content="Your Name">

    <!-- The <base> tag sets the base URL for all relative links on the page -->
    <base href="https://example.com/">

    <!-- The <link> tag links external resources like CSS files or favicons -->
    <link rel="icon" href="https://www.wikipedia.org/static/favicon/wikipedia.ico">

    <!-- The <style> tag contains internal CSS styling (can be empty or have CSS rules) -->
    <style>
        /* Example: style for the body text */
        body {
            font-family: Arial, sans-serif;
        }
    </style>

    <!-- The <script> tag is used for adding JavaScript (can be empty or have scripts) -->
    <script>
        // Example: a simple alert (optional)
        // alert("Head section loaded successfully!");
    </script>
</head>
<body>
    <h1>Important &lt;head&gt; Elements Demonstration</h1>
    <p>This webpage includes all key elements commonly used inside the <code>&lt;head&gt;</code> section.</p>
</body>
</html>
