<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded youtube video</title>
</head>
<body>
    <h2>Embedding YouTube Video using iframe (HTML only)</h2>
    <div align="center">
        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/oAMsaTCrK5c?si=XwqA4XPTWpaaVftM"
            title="Youtube video player"
            frameborder="0"
            allowfullscreen>
        </iframe>
    </div>

    <p align="center">
        <a href="https://www.youtube.com/embed/watch?v=oAMsaTCrK5c" target="_blank">
            Watch this video on Youtube
        </a>
    </p>
</body>
</html>
