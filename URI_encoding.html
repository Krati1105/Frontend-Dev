<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URI encoding</title>
</head>
<body>
     <h2>URI Encoding Demonstration</h2>

    <p>
        Original URL (with special characters):<br>
        <code>https://example.com/search?query=HTML & CSS</code>
    </p>

    <p>
        Encoded URL (spaces replaced with %20 and & encoded as %26):<br>
        <a href="https://example.com/search?query=HTML%20%26%20CSS" target="_blank">
            https://example.com/search?query=HTML%20%26%20CSS
        </a>
    </p>
</body>
</html>
